<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="assets/css/global.css" />
        <link rel="stylesheet" href="assets/css/menu.css" />
        <link rel="icon" type="image/png" href="assets/img/coffe-planet.svg" />
        <script
            src="https://kit.fontawesome.com/f112726c5a.js"
            crossorigin="anonymous"
        ></script>
        <title>Café Solaris</title>
    </head>
    <body>
        <div id="nav-container"></div>
        <section id="search">
            <h1 class="title">Menu</h1>
            <form action="" id="search-menu">
                <input type="search" />
                <button>Procurar</button>
            </form>
        </section>
        <section id="categories">
            <div class="category-nav">
                <img
                    src="assets/img/products/001.png"
                    alt=""
                    class="category-img"
                />
                <h3 class="category-name">Esquenta black friday</h3>
            </div>
            <div class="category-nav">
                <img
                    src="assets/img/products/011.png"
                    alt=""
                    class="category-img"
                />
                <h3 class="category-name">Bebidas Quentes</h3>
            </div>
            <div class="category-nav">
                <img
                    src="assets/img/products/031.webp"
                    alt=""
                    class="category-img"
                />
                <h3 class="category-name">Bebidas Geladas</h3>
            </div>
            <div class="category-nav">
                <img
                    src="assets/img/products/037.png"
                    alt=""
                    class="category-img"
                />
                <h3 class="category-name">Cappuccinos</h3>
            </div>
            <div class="category-nav">
                <img
                    src="assets/img/products/048.png"
                    alt=""
                    class="category-img"
                />
                <h3 class="category-name">Doces & Bolos</h3>
            </div>
            <div class="category-nav">
                <img
                    src="assets/img/products/058.png"
                    alt=""
                    class="category-img"
                />
                <h3 class="category-name">Cafés</h3>
            </div>
        </section>
        <section id="product-grid">
            <a href="">
                <div class="product-card">
                    <img
                        class="product-card-img"
                        src="assets/img/test.png"
                        alt="Cappuccino"
                    />
                    <div class="product-card-content">
                        <div class="tag">
                            <p class="tag">☕️ Café</p>
                        </div>
                        <h1 class="product-name">Cappuccino</h1>
                        <p>
                            Espresso, leite vaporizado e espuma aveludada, com
                            canela por cima.
                        </p>
                        <div class="product-card-content-price">
                            <div>
                                <h1>R$ 14,90</h1>
                            </div>
                            <div>
                                <div class="btn-primary">
                                    Ver Produto
                                    <i class="fa-solid fa-arrow-right"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </a>
        </section>
        <div id="footer-container"></div>
        <script src="assets/javascript/components.js"></script>
    </body>
</html>
