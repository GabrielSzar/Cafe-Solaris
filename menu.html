<!doctype html>
<html lang="pt-BR">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="assets/css/global.css" />

        ></script>
        <title>Café Solaris - Cardápio</title>

        <section id="search">

        <main>
            <h2 id="search-h2"></h2>
            <section id="products-grid"></section>

        <div id="footer-container"></div>
        <script src="assets/javascript/components.js"></script>
        <script src="assets/javascript/products.js"></script>
        <script src="assets/javascript/menu-load.js"></script>
        <script src="assets/javascript/session.js"></script>
