<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="assets/css/global.css" />
        <link rel="stylesheet" href="assets/css/singin.css" />
        <link rel="icon" type="image/png" href="assets/img/coffe-planet.svg" />
        <script
            src="https://kit.fontawesome.com/f112726c5a.js"
            crossorigin="anonymous"
        ></script>
        <title>Café Solaris</title>
    </head>
    <body>
        <div id="nav-container"></div>
        <section class="singin-sec">
            <div class="singin-container">
                <div class="singin-header">
                    <div class="singin-icon">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h2>Crie sua Conta</h2>
                    <p>
                        Preencha os seus dados abaixo para se cadastrar no Café
                        Solaris
                    </p>
                </div>

                <form class="singin-form">
                    <div class="form-section-title">
                        <i class="fa-solid fa-id-card icon-title"></i>
                        <h3>Dados Pessoais</h3>
                    </div>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="nome">
                                <i class="fa-solid fa-user"></i> Nome Completo
                            </label>
                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Digite seu nome completo"
                                required
                                maxlength="50"
                            />
                        </div>

                        <div class="form-group">
                            <label for="email">
                                <i class="fa-solid fa-envelope"></i> E-mail
                            </label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="seuEmail@exemplo.com"
                                required
                                maxlength="100"
                            />
                        </div>
                        <div class="form-group">
                            <label for="senha">
                                <i class="fa-solid fa-lock"></i> Senha
                            </label>
                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="No minimo seis caracteres"
                                required
                                maxlength="100"
                            />
                        </div>
                        <div class="form-group">
                            <label for="numero_telefone">
                                <i class="fa-solid fa-phone"></i> Telefone /
                                Celular
                            </label>
                            <input
                                type="tel"
                                id="numero_telefone"
                                name="numero_telefone"
                                placeholder="(00) 00000-0000"
                                required
                                maxlength="20"
                            />
                        </div>

                        <div class="form-group">
                            <label for="cpf">
                                <i class="fa-solid fa-address-card"></i> CPF
                            </label>
                            <input
                                type="text"
                                id="cpf"
                                name="cpf"
                                placeholder="000.000.000-00"
                                required
                                maxlength="14"
                            />
                        </div>
                    </div>

                    <div class="form-section-title">
                        <i class="fa-solid fa-location-dot icon-title"></i>
                        <h3>Endereço de Entrega</h3>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cep">
                                <i class="fa-solid fa-map-pin"></i> CEP
                            </label>
                            <input
                                type="text"
                                id="cep"
                                name="cep"
                                placeholder="00000-000"
                                required
                                maxlength="10"
                            />
                        </div>

                        <div class="form-group">
                            <label for="bairro">
                                <i class="fa-solid fa-city"></i> Bairro
                            </label>
                            <input
                                type="text"
                                id="bairro"
                                name="bairro"
                                placeholder="Seu bairro"
                                required
                                maxlength="100"
                            />
                        </div>

                        <div class="form-group span-2">
                            <label for="rua">
                                <i class="fa-solid fa-road"></i> Rua
                            </label>
                            <input
                                type="text"
                                id="rua"
                                name="rua"
                                placeholder="Nome da rua ou avenida"
                                required
                                maxlength="150"
                            />
                        </div>

                        <div class="form-group">
                            <label for="numero">
                                <i class="fa-solid fa-house"></i> Número
                            </label>
                            <input
                                type="text"
                                id="numero"
                                name="numero"
                                placeholder="Ex: 123"
                                required
                                maxlength="20"
                            />
                        </div>

                        <div class="form-group">
                            <label for="complemento_endereco">
                                <i class="fa-solid fa-building"></i> Complemento
                            </label>
                            <input
                                type="text"
                                id="complemento_endereco"
                                name="complemento_endereco"
                                placeholder="Apto, bloco, referência..."
                                maxlength="100"
                            />
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="submit-btn">
                            Concluir Cadastro
                        </button>
                        <div class="form-footer">
                            <p>Já possui uma conta?</p>
                            <button
                                type="button"
                                command="show-modal"
                                commandfor="login-dialog"
                                class="login-link-btn"
                            >
                                Fazer Login
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
        <div id="footer-container"></div>
        <script src="assets/javascript/components.js"></script>
        <script src="assets/javascript/session.js"></script>
        <script src="assets/javascript/cart.js"></script>
        <script src="assets/javascript/singin.js"></script>
    </body>
</html>
