<dialog id="login-dialog">
    <button command="close" commandfor="login-dialog" class="exit-btn">
        <i class="fa-solid fa-x"></i>
    </button>
    <div id="login-dialog-header">
        <div class="logo"></div>
        <h2>Entrar na Café Solaris</h2>
    </div>
    <form action="" id="login-dialog-form">
        <h3>Email</h3>
        <input
            type="email"
            name="email_login"
            id="email_login"
            placeholder="seuEmail@exemplo.com"
            required
        />
        <h3>Senha</h3>
        <input
            type="password"
            name="password_login"
            id="password_login"
            placeholder="••••••••"
            required
        />
        <button>Entrar</button>
    </form>
    <div id="other-login">
        <h3>outras formas de entrar</h3>
        <div class="login-method">
            <p>Entrar com o Google</p>
            <i class="fa-brands fa-google"></i>
        </div>
        <div class="login-method">
            <p>Entrat com a Apple</p>
            <i class="fa-brands fa-apple"></i>
        </div>
    </div>
    <div id="singin-modal">
        <p>Não tem conta?</p>
        <a href="singin.html">Cadastre-se</a>
    </div>
</dialog>
