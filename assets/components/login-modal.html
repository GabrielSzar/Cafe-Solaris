<dialog id="login-dialog" aria-labelledby="login-titulo">
    <button type="button" class="exit-btn" data-close-dialog aria-label="Fechar">
        <i class="fa-solid fa-x"></i>
    </button>
    <div id="login-dialog-header">
        <div class="logo"></div>
        <h2 id="login-titulo">Entrar na Café Solaris</h2>
    </div>
    <form id="login-dialog-form">
        <h3>E-mail</h3>
        <input
            type="email"
            name="email_login"
            id="email_login"
            placeholder="seuEmail@exemplo.com"
            autocomplete="email"
            required
        />
        <h3>Senha</h3>
        <input
            type="password"
            name="password_login"
            id="password_login"
            placeholder="••••••••"
            autocomplete="current-password"
            required
        />
        <button type="submit">Entrar</button>
    </form>
    <div id="other-login">
        <h3>Outras formas de entrar</h3>
        <div class="login-method">
            <p>Entrar com o Google</p>
            <i class="fa-brands fa-google"></i>
        </div>
        <div class="login-method">
            <p>Entrar com a Apple</p>
            <i class="fa-brands fa-apple"></i>
        </div>
    </div>
    <div id="singin-modal">
        <p>Não tem conta?</p>
        <a href="singin.html">Cadastre-se</a>
    </div>
</dialog>
