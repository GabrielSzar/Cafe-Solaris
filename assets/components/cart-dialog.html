<dialog id="cart-dialog">
    <button command="close" commandfor="cart-dialog" class="exit-btn">
        <i class="fa-solid fa-x"></i>
    </button>
    <div id="cart-dialog-header">
        <div class="logo"></div>
        <h2>Seu carrinho</h2>
    </div>
    <div id="cart-items"></div>
    <div id="cart-total">
        <h3>Total</h3>
        <h3 id="cart-total-price">R$ 0,00</h3>
    </div>
    <button id="cart-buy" disabled>Comprar</button>
</dialog>
