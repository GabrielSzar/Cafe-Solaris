<dialog id="cart-dialog">
    <button command="close" commandfor="cart-dialog" class="exit-btn">
        <i class="fa-solid fa-x"></i>
    </button>
    <h2>Adicionado ao carrinho</h2>
    <ul id="cart-items"></ul>
    <div id="cart-total">
        <h3>Total</h3>
        <h3 id="cart-total-price">R$ 0,00</h3>
    </div>
    <button class="btn-primary" id="cart-buy">Comprar</button>
</dialog>
